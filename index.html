<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooter-Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-row">
    <canvas id="game" width="480" height="640"></canvas>
    <aside class="high-score">
      <span class="high-score-label">High Score</span>
      <span id="high-score" class="high-score-value">0</span>
    </aside>
  </div>
  <p class="controls">Move: &larr; &rarr; &uarr; &darr; or W A S D &middot; Fire: Space &middot; Restart: Enter</p>
  <script src="game.js"></script>
</body>
</html>
