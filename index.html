<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooter-Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-row">
    <canvas id="game" width="480" height="640"></canvas>
    <div class="side-panels">
      <aside class="high-score">
        <span class="high-score-label">High Score</span>
        <span id="high-score" class="high-score-value">0</span>
      </aside>
      <aside class="shotgun">
        <span class="panel-label">Shotgun</span>
        <span id="shotgun-cooldown" class="panel-value">Ready</span>
      </aside>
    </div>
  </div>
  <p class="controls">Move: &larr; &rarr; &uarr; &darr; or W A S D &middot; Fire: Space &middot; Shotgun: Shift &middot; Pause: Esc &middot; Restart: Enter</p>
  <script src="game.js"></script>
</body>
</html>
